name: TCG optimizer build

on:
  push:
    branches:
      - android-arm64-tcg-optimization
  pull_request:
    branches:
      - android-arm64-tcg-optimization

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3-pip \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Install x86_64 guest compiler
        if: matrix.arch == 'aarch64'
        run: sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Install Meson
        run: python3 -m pip install --break-system-packages meson

      - name: Configure QEMU
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=x86_64-linux-user,x86_64-softmmu \
            --enable-tcg \
            --disable-docs \
            --disable-werror \
            --disable-tools \
            --disable-slirp \
            --disable-capstone

      - name: Build QEMU
        run: ninja -C build -j2

      - name: Run unit tests
        run: meson test -C build --suite unit --print-errorlogs

      - name: Run x86_64 TCG codegen smoke test
        if: matrix.arch == 'aarch64'
        run: |
          cat > "$RUNNER_TEMP/tcg-codegen-smoke.c" <<'EOF'
          #include <stdint.h>

          static uint64_t pop64_ref(uint64_t x)
          {
              uint64_t n = 0;
              for (unsigned i = 0; i < 64; i++) {
                  n += (x >> i) & 1;
              }
              return n;
          }

          static uint32_t pop32_ref(uint32_t x)
          {
              uint32_t n = 0;
              for (unsigned i = 0; i < 32; i++) {
                  n += (x >> i) & 1;
              }
              return n;
          }

          static uint64_t rol64_ref(uint64_t x, unsigned n)
          {
              n &= 63;
              return n ? (x << n) | (x >> (64 - n)) : x;
          }

          static uint32_t rol32_ref(uint32_t x, unsigned n)
          {
              n &= 31;
              return n ? (x << n) | (x >> (32 - n)) : x;
          }

          int main(void)
          {
              static const uint64_t values[] = {
                  0, 1, UINT64_MAX, 0x0123456789abcdefULL,
                  0x8000000000000001ULL, 0x5555555555555555ULL,
                  0xaaaaaaaaaaaaaaaaULL, 0xfedcba9876543210ULL
              };

              for (unsigned i = 0; i < sizeof(values) / sizeof(values[0]); i++) {
                  uint64_t x = values[i], got64;
                  uint32_t x32 = (uint32_t)x, got32;
                  unsigned shift = (i * 11 + 7) & 63;

                  __asm__ volatile("popcntq %1, %0"
                                   : "=r"(got64) : "r"(x) : "cc");
                  if (got64 != pop64_ref(x)) return 1;

                  __asm__ volatile("popcntl %1, %0"
                                   : "=r"(got32) : "r"(x32) : "cc");
                  if (got32 != pop32_ref(x32)) return 2;

                  got64 = x;
                  __asm__ volatile("rolq $13, %0" : "+r"(got64) : : "cc");
                  if (got64 != rol64_ref(x, 13)) return 3;

                  got64 = x;
                  __asm__ volatile("rolq %%cl, %0"
                                   : "+r"(got64) : "c"(shift) : "cc");
                  if (got64 != rol64_ref(x, shift)) return 4;

                  got32 = x32;
                  __asm__ volatile("roll $9, %0" : "+r"(got32) : : "cc");
                  if (got32 != rol32_ref(x32, 9)) return 5;

                  got32 = x32;
                  __asm__ volatile("roll %%cl, %0"
                                   : "+r"(got32) : "c"(shift) : "cc");
                  if (got32 != rol32_ref(x32, shift)) return 6;
              }
              return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O0 -mno-popcnt -static -o "$RUNNER_TEMP/tcg-codegen-smoke" "$RUNNER_TEMP/tcg-codegen-smoke.c"
          ./build/qemu-x86_64 -cpu max "$RUNNER_TEMP/tcg-codegen-smoke"

      - name: Verify QEMU binary
        run: ./build/qemu-system-x86_64 --version
